<style>
/* Layout: app de celular centralizado; no desktop vira um aparelho sobre a mesa, no celular ocupa a tela toda */
:root{
  --bg:#E4E6EE; --app:#F7F8FA; --surface:#FFFFFF; --surface-2:#E9EBF2; --line:#D7DAE5;
  --fg:#1F2440; --fg-2:#4A4F6E; --fg-3:#6B7090;
  --ink:#1F2440; --on-ink:#F7F8FA; --apricot:#E8A27C; --clay:#9C5A36; --clay-bg:#F6E7DD;
  --sage:#8FAE9B; --ok:#3F6B57; --ok-bg:#E3EEE7; --warn:#8A6416; --warn-bg:#F6EBD3;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", "Segoe UI", Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --app:#141728; --surface:#1B1F36; --surface-2:#242944; --line:#2F3556;
  --fg:#EEF0F6; --fg-2:#B9BDD0; --fg-3:#8E93AE; --ink:#F7F8FA; --on-ink:#1F2440; --clay:#F0B48F; --clay-bg:#3A2A2A;
  --ok:#9FC3AE; --ok-bg:#20352B; --warn:#E3C27A; --warn-bg:#3A3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --app:#141728; --surface:#1B1F36; --surface-2:#242944; --line:#2F3556;
  --fg:#EEF0F6; --fg-2:#B9BDD0; --fg-3:#8E93AE; --ink:#F7F8FA; --on-ink:#1F2440; --clay:#F0B48F; --clay-bg:#3A2A2A;
  --ok:#9FC3AE; --ok-bg:#20352B; --warn:#E3C27A; --warn-bg:#3A3220; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--apricot);outline-offset:2px}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;gap:32px;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.side{max-width:300px;position:sticky;top:24px;display:grid;gap:14px;padding-top:12px}
.side h1{font-family:var(--display);font-size:28px;line-height:1.15;margin:0;font-weight:600}
.side p{margin:0;color:var(--fg-2);font-size:14px}
.tour{display:grid;gap:6px}
.tour button{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg-2)}
.tour button.on{background:var(--surface);color:var(--fg);border-color:var(--apricot)}
.tour b{font-variant-numeric:tabular-nums;color:var(--clay);width:16px}
.app{width:100%;max-width:420px;min-height:820px;height:calc(100vh - 48px);max-height:900px;background:var(--app);border-radius:32px;box-shadow:0 24px 64px rgba(20,23,40,.22);display:flex;flex-direction:column;overflow:hidden;position:relative;border:1px solid var(--line)}
@media (max-width:760px){
  .side{display:none}
  .stage{padding:0}
  .app{max-width:none;height:100%;min-height:100%;max-height:none;border-radius:0;border:0;box-shadow:none}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 10px;border-bottom:1px solid var(--line);background:var(--app)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px}
.brand svg{width:28px;height:28px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-3)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.scroll{flex:1;overflow-y:auto;padding:18px;display:grid;gap:14px;align-content:start}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom, 0px)}
.nav button{background:none;border:0;padding:10px 0 12px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--fg-3)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg);font-weight:600}
.nav button.on svg{color:var(--clay)}
.badge-dot{position:relative}
.badge-dot::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--clay);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
h2.t{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h3.t{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--clay)}
.muted{color:var(--fg-2)}
.small{font-size:12.5px;color:var(--fg-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--ink);color:var(--on-ink);text-align:center;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--apricot);border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.block{background:var(--clay-bg);color:var(--clay)}
.pill.info{background:var(--surface-2);color:var(--fg-2)}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.bar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .track span{display:block;height:100%;border-radius:999px;background:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.plan{border:2px solid var(--apricot)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.list li svg{flex:0 0 18px;width:18px;height:18px;margin-top:2px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.swatches div{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:ui-monospace,Menlo,monospace}
.mono-logo{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;text-align:center}
.cal .h{color:var(--fg-3);font-weight:600;padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;position:relative;color:var(--fg-2);background:transparent;border:0;padding:0}
.cal .d.has{background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:600}
.cal .d .dot{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%}
.post-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.post-item .date{text-align:center;font-size:11px;color:var(--fg-3);line-height:1.2}
.post-item .date b{display:block;font-size:18px;color:var(--fg);font-family:var(--display)}
.post-item .tt{font-size:13.5px;font-weight:600;line-height:1.3}
.preview{border-radius:14px;padding:20px;display:grid;gap:10px;aspect-ratio:4/5;align-content:space-between;overflow:hidden;position:relative}
.preview h4{font-family:var(--display);font-size:22px;line-height:1.2;margin:0;font-weight:600}
.preview .sig{font-size:10.5px;opacity:.9}
.chat{display:grid;gap:10px}
.msg{max-width:88%;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45}
.msg.ai{background:var(--surface);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--ink);color:var(--on-ink);justify-self:end;border-bottom-right-radius:4px}
.msg .who{font-size:11px;font-weight:600;color:var(--clay);margin-bottom:2px}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--app)}
.composer button{border:0;border-radius:999px;background:var(--ink);color:var(--on-ink);padding:0 16px;font-weight:600}
.check{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check svg{width:18px;height:18px;margin-top:1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.hero{grid-column:span 2;background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kpi.hero .small{color:inherit;opacity:.8}
.funnel{display:grid;gap:6px}
.funnel div{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.funnel span.b{height:10px;border-radius:999px;background:var(--apricot);display:block}
.site{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#FFFFFF;color:#1F2440}
.site .hero{padding:18px;display:grid;gap:8px}
.site .hero h4{font-family:var(--display);font-size:22px;margin:0;line-height:1.2}
.site .foot{font-size:10.5px;padding:10px 18px;border-top:1px solid #E3E5EC;color:#4A4F6E}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:12px 14px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .3s, transform .3s}
.toast[hidden]{display:none}
.tag-ex{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 6px;font-weight:600}
.prefs{display:flex;flex-wrap:wrap;gap:6px}
.prefs span{font-size:11.5px;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:3px 9px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

/* ---------- diagnóstico: função pura ---------- */
function diagnose(a){
  var p=a.presence, f=+a.freq;
  var insta = !p.insta ? 5 : (f===0?20:f===1?40:f===5?62:75);
  var site = p.site ? 65 : 0;
  var google = p.gmb ? 55 : 10;
  var issues=[];
  if(!p.rqe) issues.push("Bio sem CRM com a palavra MÉDICO e RQE");
  if(p.insta && f>0) issues.push("1 post antigo com promessa de resultado");
  var conf = Math.max(20, 100 - (p.rqe?0:30) - (p.insta&&f>0?20:0));
  var total = Math.round(insta*.3 + site*.25 + google*.25 + conf*.2);
  var plan="consultorio", why=[];
  if(a.moment==="clinica"){plan="clinica";why.push("Você atende com outros médicos: a marca da clínica e os perfis individuais ficam juntos.");}
  else if(a.moment==="novo" && +a.budget<=300){plan="essencial";why.push("Você está começando e o orçamento é enxuto: o Essencial monta a base certa.");}
  else if(a.goal==="procedimento" || +a.budget>=3000 || (+a.time<=30 && +a.budget>=1000 && a.goal!=="google")){plan="autoridade";why.push(+a.time<=30?"Você tem menos de 1 hora por semana: uma gestora de conta revisa por você.":"Seu objetivo pede campanhas pagas e acompanhamento próximo.");}
  else {why.push("Você já tem consultório e quer constância: site, Google e conteúdo no mesmo lugar.");}
  if(!p.site) why.push("Você ainda não tem site: ele entra no plano, com SEO local.");
  var ups=[];
  if(issues.length) ups.push(["Check-up de conformidade dos posts antigos","R$ 197 avulso","Revisamos seu histórico e indicamos o que ajustar ou arquivar."]);
  if(plan!=="autoridade" && plan!=="clinica" && (a.goal==="procedimento"||a.goal==="pacientes")) ups.push(["Campanha de "+spec().proc,"no plano Autoridade","Anúncios para quem busca "+spec().proc+" perto do seu consultório."]);
  ups.push(["Ensaio de fotos no consultório","parceiro, a partir de R$ 690","Fotos reais aumentam a confiança mais do que imagens de banco."]);
  if(a.goal==="google"||!p.gmb) ups.push(["Pedido de avaliações após a consulta","incluso no Autoridade","Mensagem automática e ética pedindo avaliação no Google."]);
  return {total:total, parts:[["Instagram",insta],["Site",site],["Google",google],["Conformidade",conf]], issues:issues, plan:plan, why:why, ups:ups};
}

  if(pp[3]==="flag") return ["Guardião pediu ajuste","block"];
  if(pp[0]==="16"||pp[0]==="17") return ["Aguardando você","warn"];
  return ["Aprovado","ok"];

  S.review={day:p[0],type:p[1],title:p[2],fixed:!flagged,short:false,soft:false,img:0,
    msgs:[["ai","Jalecon","Preparei o "+p[1].toLowerCase()+" \""+p[2]+"\" para "+p[0]+"/11, no tom "+({acolhedor:"acolhedor",tecnico:"técnico",proximo:"próximo"}[S.a.tone])+"."+(flagged?" O Guardião encontrou um ponto a ajustar antes da publicação.":" O Guardião não encontrou problemas.")]]};

}

function reply(text){
  var r=S.review, s=spec(), t=text.toLowerCase();
  r.msgs.push(["me","Você",text]);
  if(/sugest|guardi|aplicar|corrig/.test(t)){
    r.fixed=true; r.title=s.flag.good;
    r.msgs.push(["ai","Jalecon","Pronto. Troquei o título por \""+s.flag.good+"\". O Guardião rechecou: tudo certo."]);
    addPref("Evitar promessas como \"de vez\" e \"garantido\"");
  } else if(/acolhed|human|carinh|gentil/.test(t)){
    r.soft=true; r.title= r.fixed ? s.flag.soft : r.title;
    r.msgs.push(["ai","Jalecon", r.fixed?"Deixei o texto mais acolhedor: \""+s.flag.soft+"\".":"Posso deixar mais acolhedor, mas antes preciso corrigir a promessa de resultado. Quer aplicar a sugestão do Guardião?"]);
    addPref("Tom acolhedor nos títulos");
  } else if(/curt|encurt|resum|menor/.test(t)){
    r.short=true; r.msgs.push(["ai","Jalecon","Encurtei a capa e deixei o detalhe para os próximos cartões do carrossel."]);
    addPref("Capas com pouco texto");
  } else if(/capa|imagem|foto|cor/.test(t)){
    r.img++; r.msgs.push(["ai","Jalecon","Troquei a cor da capa mantendo a sua paleta. Imagens de pacientes nunca são usadas sem consentimento registrado."]);
  } else if(/cura|garant|100%|definitiv|melhor de/.test(t)){
    r.msgs.push(["ai","Guardião","Não posso usar esse termo: ele promete resultado ou é superlativo, o que a Resolução CFM 2.336/2023 não permite. Que tal uma versão educativa?"]);
  } else {
    r.msgs.push(["ai","Jalecon","Entendi: \""+text+"\". Ajustei o texto e vou lembrar disso nas próximas peças."]);
    addPref(text.length>40?text.slice(0,40)+"…":text);
  }
}

  return top()+'<div class="scroll">'+
  '<div class="eyebrow">Site e Google</div><h2 class="t">Seu site está no ar</h2>'+
  '<div class="site"><div class="hero" style="background:'+p[3]+'"><span style="font-size:11px;font-weight:600;letter-spacing:.1em;color:'+p[0]+'">'+esc(s.full.toUpperCase())+' · SÃO PAULO</span><h4 style="color:'+p[0]+'">'+esc(S.a.name)+'</h4><p style="margin:0;font-size:13px;color:#4A4F6E">Atendimento particular com hora marcada. '+esc(s.flag.good)+'.</p><span style="display:inline-block;justify-self:start;background:'+p[0]+';color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600">Agendar pelo WhatsApp</span></div>'+
  '<div style="padding:14px 18px;display:grid;gap:6px;font-size:13px"><b>Tratamentos</b><span style="color:#4A4F6E">Avaliação, '+esc(s.proc)+', acompanhamento</span><b>Endereço</b><span style="color:#4A4F6E">Rua de exemplo, 100 · Pinheiros</span></div>'+
  '<div class="foot">'+esc(S.a.name)+' · '+esc(S.a.crm)+' · MÉDICO · '+esc(S.a.rqe)+' · Diretor técnico conforme Res. CFM 2.336/2023</div></div>'+
  '<div class="card"><div class="row between"><h3 class="t">Perfil no Google</h3><span class="pill ok">Verificado</span></div><p class="muted" style="margin:0">4,9 de 5 · 38 avaliações · horário, endereço e link de agendamento atualizados.</p><p class="small">Respostas às avaliações também passam pelo Guardião: nada de expor dados de pacientes.</p></div>'+
  '<div class="card"><h3 class="t">SEO local</h3><ul class="list"><li><span style="color:var(--ok)">'+ICON.ok+'</span>"'+esc(s.label.toLowerCase())+' em pinheiros" · posição 4</li><li><span style="color:var(--ok)">'+ICON.ok+'</span>"'+esc(s.proc)+' são paulo" · posição 11</li></ul><p class="small">Posições fictícias para demonstração.</p></div>'+
  '</div>'+nav("site");
}
function spark(vals){
  var w=300,h=60,max=Math.max.apply(null,vals),pts=vals.map(function(v,i){return [i*(w/(vals.length-1)), h-6-(v/max)*(h-14)];});
  var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="60" role="img" aria-label="Consultas por semana: '+vals.join(", ")+'"><line x1="0" y1="'+(h-6)+'" x2="'+w+'" y2="'+(h-6)+'" stroke="var(--line)"/><path d="'+d+' L'+w+' '+(h-6)+' L0 '+(h-6)+' Z" fill="var(--apricot)" opacity=".18"/><path d="'+d+'" fill="none" stroke="var(--clay)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="var(--clay)"/></svg>';
}
function vPulse(){
  var s=spec(), d=diagnose(S.a);
  var f=[["Alcance","18.400",100],["Visitas ao site","1.240",62],["Contatos no WhatsApp","86",34],["Consultas agendadas","23",18]];
  return top()+'<div class="scroll">'+
  '<div class="eyebrow">Pulso · outubro de 2026</div><h2 class="t">Bom dia, '+esc(S.a.name.split(" ").slice(0,2).join(" "))+'</h2>'+
  '<div class="kpis"><div class="kpi hero"><span class="small">Consultas agendadas pela sua presença digital</span><b>23</b><span class="small">+9 em relação a setembro · 14 particulares novos</span>'+spark([2,3,3,5,4,6,7,8])+'</div>'+
  '<div class="kpi"><span class="small">Nota de presença</span><b>'+Math.min(96,d.total+29)+'</b><span class="small">era '+d.total+' no diagnóstico</span></div>'+
  '<div class="kpi"><span class="small">Alertas do Guardião</span><b>'+guardCount()+'</b><span class="small">'+(guardCount()?"peça aguarda ajuste":"tudo em dia")+'</span></div></div>'+
  '<div class="card"><h3 class="t">Do conteúdo à consulta</h3><div class="funnel">'+f.map(function(x){return '<div><span>'+x[0]+'</span><span class="b" style="width:'+x[2]+'%"></span><span class="num" style="text-align:right">'+x[1]+'</span></div>';}).join("")+'</div><p class="small">Consultas medidas pela integração com a agenda e o WhatsApp.</p></div>'+
  '<div class="card"><div class="row between"><h3 class="t">Recomendação do mês</h3><span class="pill info">IA</span></div><p class="muted" style="margin:0">Peças sobre "'+esc(s.posts[0][2].toLowerCase())+'" geraram 3 vezes mais contatos. Sugerimos uma série de 4 posts sobre o tema em dezembro.</p><button class="btn ghost" data-go="calendar">Ver no calendário</button></div>'+
  '<div class="card plan"><span class="eyebrow">Oportunidade</span><b>Campanha de '+esc(s.proc)+'</b><p class="small" style="margin:0">No plano Autoridade: anúncios para quem busca '+esc(s.proc)+' a até 5 km, com gestora de conta. Estimativa de 8 a 12 consultas a mais por mês (exemplo).</p></div>'+
  '<button class="btn ghost" data-act="restart">Refazer o diagnóstico</button>'+
  '</div>'+nav("pulse");
}

/* ---------- render e eventos ---------- */
var app=document.getElementById("app"), tourEl=document.getElementById("tour"), toastTimer=null;
function render(){
  var v={welcome:vWelcome,quiz:vQuiz,report:vReport,brand:vBrand,calendar:vCalendar,review:vReview,site:vSite,pulse:vPulse}[S.screen]();
  var showNavScreens={brand:1};
  if(showNavScreens[S.screen]) v+=nav("brand");
  app.innerHTML=v+'<div class="toast" id="toast" role="status" '+(S.toast?"":"hidden")+'>'+esc(S.toast)+'</div>';
  tourEl.innerHTML=TOUR.map(function(t,i){return '<button data-go="'+t[0]+'" class="'+(S.screen===t[0]?"on":"")+'"><b>'+(i+1)+'</b>'+t[1]+'</button>';}).join("");
  var sc=app.querySelector(".scroll"); if(sc && S._keepScroll){sc.scrollTop=S._keepScroll;} S._keepScroll=0;
  try{localStorage.setItem("jalecon-demo",JSON.stringify({a:S.a,approved:S.approved,prefs:S.prefs}));}catch(e){}
}
function go(screen){
  S.screen=screen;
  if(screen==="quiz") S.step=S.step||0;
  if(screen==="review" && !S.review){var f=null;spec().posts.forEach(function(x){if(x[3]==="flag")f=x[0];});startReview(f);}
  render();
  var sc=app.querySelector(".scroll"); if(sc) sc.scrollTop=0;
}
function toast(msg){S.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){S.toast="";var t=document.getElementById("toast");if(t)t.hidden=true;},3200);}
document.addEventListener("click",function(e){
  var el=e.target.closest("button"); if(!el) return;
  if(el.dataset.go){ if(el.dataset.go==="quiz"){S.step=0;} go(el.dataset.go); return; }
  if(el.dataset.set){ S.a[el.dataset.set]=el.dataset.val; if(el.dataset.set==="spec"){S.review=null;S.palAlt=0;} render(); return; }
  if(el.dataset.tog){ S.a.presence[el.dataset.tog]=!S.a.presence[el.dataset.tog]; render(); return; }
  if(el.dataset.open){ startReview(el.dataset.open); go("review"); return; }
  if(el.dataset.say){ var sc=app.querySelector(".scroll"); S._keepScroll=sc?sc.scrollHeight:0; reply(el.dataset.say); render(); var sc2=app.querySelector(".scroll"); if(sc2) sc2.scrollTop=sc2.scrollHeight; return; }
  var act=el.dataset.act;
  if(act==="startQuiz"){S.step=0;go("quiz");}
  else if(act==="next"){ if(S.step<Q.length-1){S.step++;render();} else go("report"); }
  else if(act==="back"){ if(S.step>0){S.step--;render();} }
  else if(act==="redo"){S.step=0;go("quiz");}
  else if(act==="restart"){S.step=0;S.review=null;S.approved={};S.prefs=[];go("quiz");}
  else if(act==="altPal"){S.palAlt=(S.palAlt+1)%4;render();}
  else if(act==="approve"){ var r=S.review; S.approved[S.a.spec+r.day]=true; toast("Agendado para "+r.day+"/11 às 19h. Checado pelo Guardião."); }
});
document.addEventListener("input",function(e){var f=e.target.dataset&&e.target.dataset.field; if(f){S.a[f]=e.target.value;}});
document.addEventListener("submit",function(e){
  if(e.target.dataset.form==="chat"){e.preventDefault(); var inp=e.target.querySelector("input"); var v=inp.value.trim(); if(!v) return; reply(v); render(); var sc=app.querySelector(".scroll"); if(sc) sc.scrollTop=sc.scrollHeight; var ni=document.getElementById("say"); if(ni) ni.focus();}
});
try{var saved=JSON.parse(localStorage.getItem("jalecon-demo")||"null"); if(saved&&saved.a&&SPEC[saved.a.spec]){S.a=saved.a;S.approved=saved.approved||{};S.prefs=saved.prefs||[];}}catch(e){}
var h=(location.hash||"").replace("#",""); if(h && {welcome:1,quiz:1,report:1,brand:1,calendar:1,review:1,site:1,pulse:1}[h]) S.screen=h;
render();
})();
</script>
